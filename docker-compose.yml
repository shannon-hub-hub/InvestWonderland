services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scraper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@db:5432/scraper
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  init:
    build: .
    command: python scripts/init_db.py
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@db:5432/scraper
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  scheduler:
    build: .
    command: supercronic /app/crontab
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@db:5432/scraper
      INGEST_MAX_PAGES: ${INGEST_MAX_PAGES:-50}
      STARTUPS_GALLERY_URL: ${STARTUPS_GALLERY_URL:-https://startups.gallery/categories/stages/series-c}
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
